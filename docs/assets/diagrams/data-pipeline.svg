<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="title desc"><title id="title">Collection and deferred learning</title><desc id="desc">Collect metadata. Sources fill values; processors write flat temp fields. Queue profile learning. Build one page vector; queue configured profile folds. Resolve collection. collect() and ready resolve after asynchronous sources. Rank immediately. A component can select from previous profile history. Fold the current page. The deferred timer learns and records the page as seen.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#386680"/></marker></defs><rect width="760" height="630" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#172b40"><text x="30" y="40" font-size="24" font-weight="700">Collection and deferred learning</text><rect x="30" y="75" width="700" height="78" rx="10" fill="#edf4f8" stroke="#386680"/><text x="50" y="103" font-size="19" font-weight="600">Collect metadata</text><text x="50" y="129" font-size="15">Sources fill values; processors write flat temp fields.</text><path d="M380 153 v25" stroke="#386680" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="183" width="700" height="78" rx="10" fill="#edf4f8" stroke="#386680"/><text x="50" y="211" font-size="19" font-weight="600">Queue profile learning</text><text x="50" y="237" font-size="15">Build one page vector; queue configured profile folds.</text><path d="M380 261 v25" stroke="#386680" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="291" width="700" height="78" rx="10" fill="#edf4f8" stroke="#386680"/><text x="50" y="319" font-size="19" font-weight="600">Resolve collection</text><text x="50" y="345" font-size="15">collect() and ready resolve after asynchronous sources.</text><path d="M380 369 v25" stroke="#386680" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="399" width="700" height="78" rx="10" fill="#edf4f8" stroke="#386680"/><text x="50" y="427" font-size="19" font-weight="600">Rank immediately</text><text x="50" y="453" font-size="15">A component can select from previous profile history.</text><path d="M380 477 v25" stroke="#386680" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="507" width="700" height="78" rx="10" fill="#edf4f8" stroke="#386680"/><text x="50" y="535" font-size="19" font-weight="600">Fold the current page</text><text x="50" y="561" font-size="15">The deferred timer learns and records the page as seen.</text></g></svg>
